server:
  port: 7001

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5432/finsphere_auth
    username: fsn_user
    password: fsn@123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: fsn_identity
        format_sql: true

  data:
    redis:
      host: localhost
      port: 7379

  kafka:
    bootstrap-servers: localhost:7092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

eureka:
  instance:
    instance-id: ${spring.application.name}:${server.port}
    hostname: localhost
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:7761/eureka/

finsphere:
  jwt:
    secret: "YourVeryLongSuperSecretKeyForFinSphereNexus2026!!"
    expirationMs: 86400000

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus,metrics"
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  level:
    com.finsphere: INFO