server:
  port: 7001

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/finsphere_auth
    username: fsn_user
    password: fsn@123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Change 'update' to 'validate' since we are using Structure.sql
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: fsn
        # Professional tip: helps with debugging
        format_sql: true

  data:
    redis:
      host: localhost
      port: 7379

eureka:
  client:
    service-url:
      defaultZone: http://localhost:7761/eureka/

finsphere:
  jwt:
    secret: "YourVeryLongSuperSecretKeyForFinSphereNexus2026!!"
    expirationMs: 86400000

# Monitoring Hook: Required for the next step (Grafana/Prometheus)
management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus,metrics"
  endpoint:
    health:
      show-details: always