server:
  port: 7002

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/finsphere_chit
    username: fsn_user
    password: fsn@123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update # Good for early development
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: fsn_chit_management
  kafka:
    bootstrap-servers: localhost:7092
    consumer:
      group-id: chit-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.finsphere.common.*"
eureka:
  client:
    service-url:
      defaultZone: http://localhost:7761/eureka/