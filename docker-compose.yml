# FinSphere Nexus 2.0, the whole system on one machine.
#
#   cp .env.example .env            # then change the secrets
#   docker compose up -d --build    # first build takes a few minutes
#   open http://localhost:7080      # the web app, through the gateway
#
# Optional logs and metrics (Loki, Prometheus, Grafana on http://localhost:3000):
#   SPRING_PROFILES_ACTIVE=loki docker compose --profile observability up -d

name: finsphere-nexus

x-service-build: &service-build
  context: .
  dockerfile: docker/Dockerfile

x-service: &service
  restart: unless-stopped
  mem_limit: 768m
  volumes:
    - service-logs:/app/logs

x-service-env: &service-env
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
  CONFIG_SERVER_URL: http://config-server:7888
  CONFIG_SERVER_USERNAME: fsn-config
  CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:-fsn-config-local-secret}
  EUREKA_URL: http://discovery-server:7761/eureka/
  FSN_JWT_SECRET: ${FSN_JWT_SECRET:-local-dev-only-FinSphereNexus-2026-change-this-secret!}
  FSN_COOKIE_SECURE: ${FSN_COOKIE_SECURE:-false}
  LOKI_URL: http://loki:3100/loki/api/v1/push
  TZ: Asia/Kolkata

x-healthcheck: &healthcheck
  interval: 10s
  timeout: 6s
  retries: 30
  start_period: 40s

services:
  # ------------------------------------------------------------------ infrastructure
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      FSN_DB_PASSWORD: ${FSN_DB_PASSWORD:-fsn@123}
      TZ: Asia/Kolkata
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql/18/docker
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      # Over TCP: during first start-up the init script runs on a socket-only server, so this waits for it
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d finsphere_chit_finance"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "7379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.1.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:7092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:7092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are declared by the services themselves
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "7092:7092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  mongo:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "17017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ------------------------------------------------------------------ platform
  config-server:
    <<: *service
    build:
      <<: *service-build
      args:
        MODULE: config-server
    image: finsphere/config-server:2.0.0
    environment:
      <<: *service-env
      CONFIG_REPO_LOCATION: file:/config-repo/
    volumes:
      - ./config-repo:/config-repo:ro
      - service-logs:/app/logs
    ports:
      - "7888:7888"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "healthcheck", "7888"]

  discovery-server:
    <<: *service
    build:
      <<: *service-build
      args:
        MODULE: discovery-server
    image: finsphere/discovery-server:2.0.0
    environment:
      <<: *service-env
      EUREKA_HOSTNAME: discovery-server
    ports:
      - "7761:7761"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "healthcheck", "7761"]

  # ------------------------------------------------------------------ business services
  auth-service:
    <<: *service
    build:
      <<: *service-build
      args:
        MODULE: auth-service
    image: finsphere/auth-service:2.0.0
    environment:
      <<: *service-env
      DB_HOST: postgres
      DB_PORT: 5432
      DB_PASSWORD: ${FSN_DB_PASSWORD:-fsn@123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FSN_LEGACY_TIME_ZONE: ${FSN_LEGACY_TIME_ZONE:-Asia/Kolkata}
    ports:
      - "7001:7001"
    depends_on:
      config-server: { condition: service_healthy }
      discovery-server: { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "healthcheck", "7001"]

  chit-finance-service:
    <<: *service
    build:
      <<: *service-build
      args:
        MODULE: chit-finance-service
    image: finsphere/chit-finance-service:2.0.0
    environment:
      <<: *service-env
      DB_HOST: postgres
      DB_PORT: 5432
      DB_PASSWORD: ${FSN_DB_PASSWORD:-fsn@123}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MONGODB_URI: mongodb://mongo:27017/finsphere_transaction?serverSelectionTimeoutMS=5000&connectTimeoutMS=5000&socketTimeoutMS=15000
      FSN_LEGACY_TIME_ZONE: ${FSN_LEGACY_TIME_ZONE:-Asia/Kolkata}
    ports:
      - "7002:7002"
    depends_on:
      config-server: { condition: service_healthy }
      discovery-server: { condition: service_healthy }
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      mongo: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "healthcheck", "7002"]

  frontend-service:
    <<: *service
    build:
      <<: *service-build
      args:
        MODULE: frontend-service
    image: finsphere/frontend-service:2.0.0
    environment:
      <<: *service-env
      FSN_SUPPORT_CONTACT: ${FSN_SUPPORT_CONTACT:-your branch office}
    depends_on:
      config-server: { condition: service_healthy }
      discovery-server: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "healthcheck", "7000"]

  gateway-service:
    <<: *service
    build:
      <<: *service-build
      args:
        MODULE: gateway-service
    image: finsphere/gateway-service:2.0.0
    environment:
      <<: *service-env
    ports:
      - "7080:7080"
    depends_on:
      config-server: { condition: service_healthy }
      discovery-server: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck
      # Actuator listens on the internal management port only
      test: ["CMD", "healthcheck", "7081"]

  # ------------------------------------------------------------------ optional: logs and metrics
  loki:
    image: grafana/loki:3.5.5
    profiles: ["observability"]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"

  prometheus:
    image: prom/prometheus:v3.6.0
    profiles: ["observability"]
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.2.0
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  mongo-data:
  service-logs:
