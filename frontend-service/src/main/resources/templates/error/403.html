<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/bare :: layout('No access', ~{::pageContent})}">
<body>
<th:block th:fragment="pageContent">
<p class="error-code" aria-hidden="true">403</p>
<h1>Your account cannot open this page</h1>
<p th:if="${detail != null}" th:text="${#strings.endsWith(detail, '.') ? detail : detail + '.'}">You do not have permission to perform this action.</p>
<p>Some pages are for administrators only. If you need this one, ask an administrator.</p>
<div class="form-actions">
  <a class="btn btn-primary" th:href="@{/dashboard}" href="/dashboard">Go to the overview</a>
</div>
<p class="reference" th:if="${correlationId != null}" th:text="'Reference: ' + ${correlationId}">Reference: 3f1c</p>
</th:block>
</body>
</html>
