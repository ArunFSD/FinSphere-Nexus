<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/bare :: layout('Request not accepted', ~{::pageContent})}">
<body>
<th:block th:fragment="pageContent">
<p class="error-code" aria-hidden="true" th:text="${status}">400</p>
<h1>That request could not be handled</h1>
<p>Something in the link or the form was not valid. Go back and try again.</p>
<div class="form-actions">
  <a class="btn btn-primary" th:href="@{/dashboard}" href="/dashboard">Go to the overview</a>
</div>
<p class="reference" th:if="${correlationId != null}" th:text="'Reference: ' + ${correlationId}">Reference: 3f1c</p>
</th:block>
</body>
</html>
