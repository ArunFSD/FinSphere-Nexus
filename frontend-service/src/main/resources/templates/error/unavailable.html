<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/bare :: layout('Service unavailable', ~{::pageContent})}">
<body>
<th:block th:fragment="pageContent">
<p class="error-code" aria-hidden="true">503</p>
<h1>Part of the system is not responding</h1>
<p th:text="${message}">We could not reach the schemes and payments service. It may be starting up or restarting. Try again in a minute.</p>
<div class="form-actions">
  <button type="button" class="btn btn-primary" data-back hidden>Go back and try again</button>
  <a class="btn btn-secondary" th:href="@{/dashboard}" href="/dashboard">Go to the overview</a>
</div>
<p class="reference" th:if="${correlationId != null}" th:text="'Reference for support: ' + ${correlationId}">Reference for support: 3f1c</p>
</th:block>
</body>
</html>
