server:
  port: 7080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      routes:
        # Route for Auth Service
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**

        # Route for Chit Fund (Updated to match your service name)
        - id: chit-finance-service
          uri: lb://chit-finance-service
          predicates:
            - Path=/chits/**
            - Path=/finance/**

eureka:
  instance:
    instance-id: ${spring.application.name}:${server.port}
    hostname: localhost
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:7761/eureka/