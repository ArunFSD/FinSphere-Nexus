server:
  port: 7080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**
        - id: chit-finance-service
          uri: lb://chit-finance-service
          predicates:
            - Path=/chits/**
            - Path=/finance/**
        - id: frontend-service
          uri: lb://frontend-service
          predicates:
            - Path=/**