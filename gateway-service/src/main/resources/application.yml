# Bootstrap settings only. Routes, timeouts and everything else come from config-repo/gateway-service.yml
spring:
  application:
    name: gateway-service
  main:
    web-application-type: reactive
  config:
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:7888}"
  cloud:
    config:
      username: ${CONFIG_SERVER_USERNAME:fsn-config}
      password: ${CONFIG_SERVER_PASSWORD:fsn-config-local-secret}
      fail-fast: true
      retry:
        initial-interval: 2000
        multiplier: 1.5
        max-interval: 10000
        max-attempts: 20
