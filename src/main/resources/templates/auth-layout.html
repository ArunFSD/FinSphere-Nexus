<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="auth-layout(content, imageClass)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinSphere Nexus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/auth-style.css}">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

<header class="auth-header">
    <h1 class="brand-title">FinSphere Nexus</h1>
    <div class="brand-tagline">
        <span>Secure</span>
        <span style="color: #f3d43b;">★</span>
        <span>Smart</span>
        <span style="color: #f3d43b;">★</span>
        <span>Seamless</span>
    </div>
</header>

<main class="auth-wrapper">
    <div class="auth-card">
        <div class="row g-0">
            <!-- Dynamic Image Side -->
            <div th:class="'col-lg-6 auth-image-side ' + ${imageClass}">
                <div class="position-relative z-1">
                    <h2 class="fw-bold">Secure Financial Network</h2>
                    <p class="text-white opacity-75">Building the future of distributed wealth management.</p>
                </div>
            </div>

            <!-- Form Content Side -->
            <div class="col-lg-6 col-md-12 auth-form-side">
                <div th:replace="${content}"></div>
            </div>
        </div>
    </div>
</main>

<footer>
    &copy; 2026 FinSphere Nexus Financial Solutions
</footer>

<script th:src="@{/js/auth.js}"></script>
</body>
</html>
