<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: main-layout(~{:: #forgot-content})}">
<body id="forgot-content">
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card p-4 mt-5">
            <div class="card-body text-center">
                <div class="mb-3">
                    <i class="bi bi-shield-lock" style="font-size: 2rem; color: #0d6efd;"></i>
                </div>
                <h4 class="mb-3">Forgot Password?</h4>
                <p class="text-muted small mb-4">Enter your registered email and we'll send you instructions to reset your password.</p>

                <form id="forgotPasswordForm">
                    <div class="mb-3 text-start">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="resetEmail" placeholder="name@example.com" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Send Reset Link</button>
                </form>

                <div class="mt-4">
                    <a th:href="@{/login}" class="text-decoration-none small">Back to Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
