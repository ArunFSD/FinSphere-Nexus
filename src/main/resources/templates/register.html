<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{auth-layout :: auth-layout(~{:: #register-content}, 'img-register')}">
<body id="register-content">
<div class="mb-4">
    <h2 class="fw-bold mb-0">Join the Nexus</h2>
    <p class="text-white-50">Create your secure financial identity.</p>
</div>

<form id="registerForm" th:object="${registrationRequest}" novalidate>
    <div class="row g-3">
        <div class="col-12">
            <label class="form-label required-field">Full Name</label>
            <input type="text" class="form-control" name="fullName" placeholder="Enter your full name">
        </div>

        <div class="col-md-6 col-12">
            <label class="form-label required-field">Phone Number</label>
            <input type="text" class="form-control" name="phoneNumber" placeholder="9876543210">
        </div>

        <div class="col-md-6 col-12">
            <label class="form-label required-field">Register As</label>
            <select class="form-select" name="role">
                <option value="CUSTOMER">Customer</option>
                <option value="ADMIN">Administrator</option>
            </select>
        </div>

        <div class="col-12">
            <label class="form-labe required-field">Password</label>
            <input type="password" class="form-control" name="password" placeholder="Minimum 8 characters">
        </div>

        <div class="col-12">
            <label class="form-label">Email Address (Optional)</label>
            <input type="email" class="form-control" name="email" placeholder="name@example.com">
        </div>

        <div class="col-12">
            <label class="form-label">Care of (Optional)</label>
            <input type="text" class="form-control" name="careOf" placeholder="Enter your C/O name">
        </div>

        <div class="col-12">
            <label class="form-label required-field">Permanent Address</label>
            <textarea class="form-control fixed-textarea" name="address" rows="3" placeholder="Enter your full residential address"></textarea>
        </div>
    </div>

    <button type="submit" class="btn btn-primary w-100 mt-4">Create My Account</button>

    <div class="text-center mt-3">
        <p class="text-white">Already registered? <a th:href="@{/login}" class="fw-bold text-decoration-none" style="color: var(--accent-purple);">Log in here</a></p>
    </div>
</form>
</body>
</html>
