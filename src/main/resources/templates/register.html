<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{auth-layout :: auth-layout(~{:: #login-content})}">
<body id="login-content">
<div class="mb-4">
    <h2 class="fw-bold">Sign In</h2>
    <p class="text-muted">Enter your credentials to access your account.</p>
</div>

<form id="loginForm" th:object="${loginRequest}">
    <div class="mb-3">
        <label class="form-label small fw-semibold text-uppercase">Identifier</label>
        <input type="text" class="form-control" th:field="*{identifier}" placeholder="Email or Phone" required>
    </div>

    <div class="mb-4">
        <div class="d-flex justify-content-between">
            <label class="form-label small fw-semibold text-uppercase">Password</label>
            <a th:href="@{/forgot-password}" class="small" style="color: var(--accent-purple);">Forgot?</a>
        </div>
        <input type="password" class="form-control" th:field="*{password}" placeholder="••••••••" required>
    </div>

    <button type="submit" class="btn btn-primary w-100">Login to FinSphere</button>

    <div class="text-center mt-4">
        <p class="small text-muted">New to our network?
            <a th:href="@{/register}" class="fw-bold" style="color: var(--accent-purple);">Register Now</a>
        </p>
    </div>
</form>
</body>
</html>
